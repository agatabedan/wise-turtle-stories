services:
  - type: web
    name: wise-turtle-stories
    env: node
    rootDir: site
    plan: free
    buildCommand: cd api && npm install
    startCommand: cd api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: false
      - key: MAILERLITE_API_TOKEN
        sync: false
      - key: MAILERLITE_GROUP_ID
        sync: false
      - key: MAILERLITE_JOURNEY_GROUP_ID
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
